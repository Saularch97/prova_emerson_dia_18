services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crud_cursos}
      POSTGRES_USER: ${POSTGRES_USER:-crud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crud_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./script-sql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-crud_cursos}
      DB_USER: ${POSTGRES_USER:-crud}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-crud_dev_pass}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
